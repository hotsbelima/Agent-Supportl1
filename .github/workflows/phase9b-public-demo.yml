name: Phase 9B simplified public demo hardening

on:
  push:
    branches:
      - phase-9b-public-demo-hardening
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-demo-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: https://agent-demo.example
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_DEMO_TENANT_ID: TENANT-8OCT
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python
        run: >-
          python -m compileall -q
          agent_runtime product_backend product_api scripts tests

      - name: Apply Product migrations
        run: python -m alembic upgrade head

      - name: Run focused Phase 9B and boundary regressions
        run: >-
          python -m pytest -q
          tests/test_phase9b_public_demo.py
          tests/test_phase4c_product_api.py
          tests/test_phase6d_stale_acceptance_hook.py
          tests/test_phase7c_product_ingestion.py
          tests/test_phase7d_scenario2_tools_hitl.py

      - name: Verify Alembic metadata is clean
        run: |
          python -m alembic current
          python -m alembic check

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Audit frontend source and built bundle for secrets
        run: |
          python scripts/phase5d1_static_audit.py --frontend-root frontend
          python scripts/phase5d1_static_audit.py --frontend-root frontend --bundle-root frontend/.next/static

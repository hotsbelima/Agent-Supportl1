name: Phase 4C product API check

on:
  push:
    branches:
      - phase-4c-product-api
  pull_request:
    branches:
      - phase-4b-persisted-lifecycle
  workflow_dispatch:

jobs:
  product-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile all Python code
        run: >-
          python -m compileall -q
          product_backend product_api phase1_adk_spike phase2_backend tests

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Verify ORM metadata matches migration head
        run: python -m alembic check

      - name: Verify full migration downgrade
        run: python -m alembic downgrade base

      - name: Re-apply full migration chain
        run: python -m alembic upgrade head

      - name: Re-check migration head
        run: python -m alembic check

      - name: Run Phase 3 architecture/domain regression
        run: >-
          python -m pytest -q
          tests/test_phase3a_contracts.py
          tests/test_phase3b_domain_logic.py
          tests/test_phase3c_contract_integration.py

      - name: Run Phase 4A PostgreSQL persistence regression
        run: python -m pytest -q tests/test_phase4a_persistence.py

      - name: Run Phase 4B lifecycle PostgreSQL regression
        run: python -m pytest -q tests/test_phase4b_lifecycle.py

      - name: Run Phase 4C FastAPI PostgreSQL integration tests
        run: python -m pytest -q tests/test_phase4c_product_api.py

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained Node regression
        run: npm test

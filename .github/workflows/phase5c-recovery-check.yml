name: Phase 5C reconnect recovery check

on:
  push:
    branches:
      - phase-5c-reconnect-recovery
  pull_request:
    branches:
      - phase-5b-operational-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconnect-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_DEMO_TENANT_ID: TENANT-8OCT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile all Python code
        run: >-
          python -m compileall -q
          product_backend product_api phase1_adk_spike phase2_backend scripts tests

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Verify ORM metadata matches migration head
        run: python -m alembic check

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained root Node regression
        run: npm test

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend recovery and contract tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

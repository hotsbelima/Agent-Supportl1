name: Phase 5A persisted SSE check

on:
  push:
    branches:
      - phase-5a-persisted-sse
  pull_request:
    branches:
      - phase-4d-managed-acceptance
  workflow_dispatch:

jobs:
  persisted-sse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: http://localhost:3000,https://phase5.example.test
      SSE_POLL_INTERVAL_SECONDS: "0.05"
      SSE_HEARTBEAT_INTERVAL_SECONDS: "0.15"
      SSE_BATCH_SIZE: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile all Python code
        run: >-
          python -m compileall -q
          product_backend product_api phase1_adk_spike phase2_backend scripts tests

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Verify ORM metadata matches migration head
        run: python -m alembic check

      - name: Run Phase 3 architecture/domain regression
        run: >-
          python -m pytest -q
          tests/test_phase3a_contracts.py
          tests/test_phase3b_domain_logic.py
          tests/test_phase3c_contract_integration.py

      - name: Run Phase 4A PostgreSQL persistence regression
        run: python -m pytest -q tests/test_phase4a_persistence.py

      - name: Run Phase 4B lifecycle PostgreSQL regression
        run: python -m pytest -q tests/test_phase4b_lifecycle.py

      - name: Run Phase 4C Product API regression
        run: python -m pytest -q tests/test_phase4c_product_api.py

      - name: Run Phase 5A persisted SSE integration tests
        run: python -m pytest -q tests/test_phase5a_persisted_sse.py

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained Node regression
        run: npm test

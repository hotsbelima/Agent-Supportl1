name: Phase 7A event dispatch and operational UI
# Gate must run on the exact Phase 7A head after UI-contract tests.

on:
  push:
    branches:
      - phase-7a-event-dispatch-ui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase7a:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_DEMO_TENANT_ID: TENANT-8OCT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python
        run: >-
          python -m compileall -q
          agent_runtime product_backend product_api
          phase1_adk_spike phase2_backend scripts tests

      - name: Apply Product migrations
        run: python -m alembic upgrade head

      - name: Run focused Phase 7A dispatch tests
        run: python -m pytest -q tests/test_phase7a_event_dispatch.py

      - name: Verify Product Alembic remains clean with ADK-owned tables
        run: |
          python - <<'PY'
          import asyncio
          from agent_runtime.sessions import create_database_session_service
          from product_backend.persistence.database import DatabaseSettings, create_engine

          async def main():
              engine = create_engine(DatabaseSettings.from_env())
              try:
                  service = create_database_session_service(engine)
                  await service.prepare_tables()
              finally:
                  await engine.dispose()

          asyncio.run(main())
          PY
          python -m alembic current
          python -m alembic check

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained historical Node regression
        run: npm test

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Audit frontend source and built public bundle
        run: |
          python scripts/phase5d1_static_audit.py --frontend-root frontend
          python scripts/phase5d1_static_audit.py --frontend-root frontend --bundle-root frontend/.next/static

      - name: Build Product image
        run: docker build -f Dockerfile.product -t agent-supportl1:phase7a .

      - name: Create isolated database for live automatic-dispatch acceptance
        run: |
          python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://postgres:postgres@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              connection.execute(
                  "SELECT pg_terminate_backend(pid) FROM pg_stat_activity "
                  "WHERE datname = 'agent_supportl1_phase7a_live'"
              )
              connection.execute("DROP DATABASE IF EXISTS agent_supportl1_phase7a_live")
              connection.execute("CREATE DATABASE agent_supportl1_phase7a_live")
          PY

      - name: Apply migrations to isolated live database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1_phase7a_live
        run: python -m alembic upgrade head

      - name: Live Start simulation -> automatic ADK -> approval/replay
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1_phase7a_live
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python -m scripts.phase7a_live_acceptance --timeout-seconds 120

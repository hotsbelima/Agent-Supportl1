name: Phase 9C deterministic release gate

on:
  push:
    branches:
      - phase-9c-deterministic-release-gate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase9c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-release:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_DEMO_TENANT_ID: TENANT-8OCT
      GOOGLE_API_KEY: ""
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python
        run: >-
          python -m compileall -q
          agent_runtime product_backend product_api
          phase1_adk_spike phase2_backend scripts tests

      - name: Apply Product migrations through current head
        run: python -m alembic upgrade head

      - name: Scenario 1 approval replay stale and recovery regression
        run: >-
          python -m pytest -q
          tests/test_phase6c_human_decision_resume.py
          tests/test_phase6d_stale_acceptance_hook.py
          tests/test_phase7a_event_dispatch.py

      - name: Scenario 2 correlation tools HITL regression
        run: >-
          python -m pytest -q
          tests/test_phase7b_scenario2_contracts.py
          tests/test_phase7c_product_ingestion.py
          tests/test_phase7c_adk_dispatch.py
          tests/test_phase7d_scenario2_tools_hitl.py

      - name: Scenario 3 deterministic replanning regression
        run: >-
          python -m pytest -q
          tests/test_phase8c1_scenario3_provider_reads.py
          tests/test_phase8c2_scenario3_native_routing.py
          tests/test_phase8d_scenario3_e2e.py

      - name: Public demo security regression
        run: python -m pytest -q tests/test_phase9b_public_demo.py

      - name: Verify Alembic metadata is clean
        run: |
          python -m alembic current
          python -m alembic check

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained historical Node regression
        run: npm test

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend deterministic contract and recovery tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Audit frontend source and built public bundle
        run: |
          python scripts/phase5d1_static_audit.py --frontend-root frontend
          python scripts/phase5d1_static_audit.py --frontend-root frontend --bundle-root frontend/.next/static

      - name: Build Product image
        run: docker build -f Dockerfile.product -t agent-supportl1:phase9c .

      - name: Prove live provider is not required by deterministic gate
        run: |
          test -z "$GOOGLE_API_KEY"
          echo "PASS: Phase 9C deterministic gate did not require live Gemini credentials."

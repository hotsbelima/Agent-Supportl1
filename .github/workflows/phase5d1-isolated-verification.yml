name: Phase 5D1 isolated release verification

on:
  push:
    branches:
      - phase-5d1-isolated-verification
  pull_request:
    branches:
      - phase-5c-reconnect-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_supportl1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_supportl1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_supportl1
      FRONTEND_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
      NEXT_PUBLIC_DEMO_TENANT_ID: TENANT-8OCT

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile all Python code
        run: >-
          python -m compileall -q
          product_backend product_api phase1_adk_spike phase2_backend scripts tests

      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Verify current Alembic revision is head
        run: |
          python -m alembic current | tee /tmp/alembic-current.txt
          grep -q "(head)" /tmp/alembic-current.txt

      - name: Verify ORM metadata matches migration head
        run: python -m alembic check

      - name: Run Phase 3 regression
        run: >-
          python -m pytest -q
          tests/test_phase3a_contracts.py
          tests/test_phase3b_domain_logic.py
          tests/test_phase3c_contract_integration.py

      - name: Run Phase 4A persistence regression
        run: python -m pytest -q tests/test_phase4a_persistence.py

      - name: Run Phase 4B lifecycle regression
        run: python -m pytest -q tests/test_phase4b_lifecycle.py

      - name: Run Phase 4C Product API regression
        run: python -m pytest -q tests/test_phase4c_product_api.py

      - name: Run Phase 5A persisted SSE regression
        run: python -m pytest -q tests/test_phase5a_persisted_sse.py

      - name: Run Phase 5D1 controlled proposal acceptance
        run: python -m pytest -q tests/test_phase5d1_release_candidate.py

      - name: Run full Python regression
        run: python -m pytest -q

      - name: Run retained historical Node regression
        run: npm test

      - name: Audit frontend runtime source
        run: python scripts/phase5d1_static_audit.py --frontend-root frontend

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend unit recovery API and SSE tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build

      - name: Audit built public JS bundle
        run: >-
          python scripts/phase5d1_static_audit.py
          --frontend-root frontend
          --bundle-root frontend/.next/static

      - name: Build product backend image
        run: docker build -f Dockerfile.product -t agent-supportl1:phase5d1 .

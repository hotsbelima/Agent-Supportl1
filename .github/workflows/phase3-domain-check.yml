name: Phase 3 domain check

on:
  push:
    branches:
      - phase-3b-domain-logic
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Compile product backend
        run: python -m compileall -q product_backend
      - name: Run Phase 3A and 3B tests
        run: python -m pytest -q tests/test_phase3a_contracts.py tests/test_phase3b_domain_logic.py

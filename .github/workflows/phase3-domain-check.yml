name: Phase 3 domain check

on:
  push:
    branches:
      - phase-3b-domain-logic
      - phase-3c-contract-integration
  workflow_dispatch:

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Compile product backend
        run: python -m compileall -q product_backend
      - name: Run Phase 3A, 3B and 3C tests
        run: python -m pytest -q tests/test_phase3a_contracts.py tests/test_phase3b_domain_logic.py tests/test_phase3c_contract_integration.py


  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile all Python product/spike code
        run: python -m compileall -q product_backend phase1_adk_spike phase2_backend
      - name: Run full Python regression
        run: python -m pytest -q
      - name: Run retained Node spike tests
        run: npm test
